---
- name: Create data_source (check mode)
  stevefulme1.datarobot.data_source:
    api_url: "{{ oci_datarobot_api_url }}"
    api_key: "{{ oci_datarobot_api_key }}"
    validate_certs: false
    name: "{{ oci_datarobot_data_source_name }}"
    data_store_id: "{{ oci_datarobot_data_store_id }}"
    type: "{{ oci_datarobot_data_source_type }}"
    params: "{{ oci_datarobot_data_source_params }}"
  check_mode: true
  register: _check
- name: Verify check mode reports changed
  ansible.builtin.assert:
    that:
      - _check is changed
- name: Create data_source
  stevefulme1.datarobot.data_source:
    api_url: "{{ oci_datarobot_api_url }}"
    api_key: "{{ oci_datarobot_api_key }}"
    validate_certs: false
    name: "{{ oci_datarobot_data_source_name }}"
    data_store_id: "{{ oci_datarobot_data_store_id }}"
    type: "{{ oci_datarobot_data_source_type }}"
    params: "{{ oci_datarobot_data_source_params }}"
  register: _create
- name: Verify data_source was created
  ansible.builtin.assert:
    that:
      - _create is changed
      - _create.data_source is defined
- name: Create data_source again (idempotent)
  stevefulme1.datarobot.data_source:
    api_url: "{{ oci_datarobot_api_url }}"
    api_key: "{{ oci_datarobot_api_key }}"
    validate_certs: false
    name: "{{ oci_datarobot_data_source_name }}"
    data_store_id: "{{ oci_datarobot_data_store_id }}"
    type: "{{ oci_datarobot_data_source_type }}"
    params: "{{ oci_datarobot_data_source_params }}"
  register: _idem
- name: Verify create idempotency
  ansible.builtin.assert:
    that:
      - _idem is not changed
- name: Delete data_source
  stevefulme1.datarobot.data_source:
    api_url: "{{ oci_datarobot_api_url }}"
    api_key: "{{ oci_datarobot_api_key }}"
    validate_certs: false
    name: "{{ oci_datarobot_data_source_name }}"
    data_store_id: "{{ oci_datarobot_data_store_id }}"
    state: absent
  register: _delete
- name: Verify data_source was deleted
  ansible.builtin.assert:
    that:
      - _delete is changed
- name: Delete data_source again (idempotent)
  stevefulme1.datarobot.data_source:
    api_url: "{{ oci_datarobot_api_url }}"
    api_key: "{{ oci_datarobot_api_key }}"
    validate_certs: false
    name: "{{ oci_datarobot_data_source_name }}"
    data_store_id: "{{ oci_datarobot_data_store_id }}"
    state: absent
  register: _delete_idem
- name: Verify delete idempotency
  ansible.builtin.assert:
    that:
      - _delete_idem is not changed
